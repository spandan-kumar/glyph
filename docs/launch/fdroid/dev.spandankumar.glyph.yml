Categories:
  - Connectivity
  - Multimedia
License: MIT
AuthorName: Spandan Kumar
SourceCode: https://github.com/spandan-kumar/glyph
IssueTracker: https://github.com/spandan-kumar/glyph/issues
Changelog: https://github.com/spandan-kumar/glyph/releases

AutoName: Glyph
AntiFeatures:
  NonFreeNet:
    en-US: Promotes Discord and GitHub for community, feedback and the roadmap;
      optional animation catalog downloads use GitHub Pages. Core device control
      works locally without these services.

RepoType: git
Repo: https://github.com/spandan-kumar/glyph.git

Builds:
  - versionName: 1.4.12
    versionCode: 2024
    commit: e902f42b34be2586ba355ba50b53c9dacbd56892
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@3.47.6
    rm:
      - ios
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --no-pub --split-per-abi --target-platform
        android-arm64 --android-project-arg fdroid=true
        --dart-define=GLYPH_UPDATE_CHECK=false
    ndk: 28.2.13676358

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
VercodeOperation:
  - '%c + 2000'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.4.12
CurrentVersionCode: 2024
