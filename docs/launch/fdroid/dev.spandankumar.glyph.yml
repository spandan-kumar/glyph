AutoName: Glyph
# Listing text and images are imported from upstream fastlane metadata.
AntiFeatures:
  NonFreeNet:
    en-US: Promotes Discord and GitHub for community, feedback and the roadmap;
      optional animation catalog downloads use GitHub Pages. Core device control
      works locally without these services.

RepoType: git
Repo: https://github.com/spandan-kumar/glyph.git

# TODO: Choose signing before publication. This baseline lets F-Droid sign.
# For verified upstream-signature builds, enable BOTH fields below only after
# replacing the fingerprint and proving reproducibility against the release APK.
# Binaries: https://github.com/spandan-kumar/glyph/releases/download/v%v/glyph-%v-arm64-v8a.apk
# AllowedAPKSigningKeys:
#   - TODO_REPLACE_WITH_RELEASE_CERTIFICATE_SHA256_64_LOWERCASE_HEX_DIGITS

Builds:
  - versionName: 1.4.0
    versionCode: 2012
    commit: v1.4.0
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@3.47.6
    rm:
      - ios
    # Only ios exists upstream; add linux/macos/web/windows here if introduced.
    prebuild:
      - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - export PATH=$JAVA_HOME/bin:$$flutter$$/bin:$PATH
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    # Do not scanignore .pub-cache: downloaded plugin source must be scanned.
    # Delete flagged binaries in that cache; do not blanket-ignore dependencies.
    scandelete:
      - .pub-cache
    build:
      - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - export PATH=$JAVA_HOME/bin:$$flutter$$/bin:$PATH
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --no-pub --split-per-abi --target-platform android-arm64 --android-project-arg fdroid=true
    ndk: 28.2.13676358
    # TODO: For reproducibility, compare CI paths/JDK/SDK with F-Droid and add
    # matching path setup in BOTH prebuild and build if APK differences require it.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
# Flutter's default split code is base + 1000 * ABI index (arm64 = 2).
# Arm64-only avoids overlapping codes across ABI builds as the base increases.
VercodeOperation:
  - '%c + 2000'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.4.0
CurrentVersionCode: 2012
