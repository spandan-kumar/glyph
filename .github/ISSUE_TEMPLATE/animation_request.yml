name: Animation request
description: Suggest an animation, sprite or pack you'd like on your display.
labels: [animation-request]
body:
  - type: markdown
    attributes:
      value: |
        Pixel artists welcome: you can also add it yourself, see [CONTRIBUTING.md](https://github.com/spandan-kumar/glyph/blob/main/CONTRIBUTING.md#add-an-animation-in-5-minutes).
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should it show, and how should it move?
      placeholder: "A cat that stretches, yawns and curls up to sleep"
    validations:
      required: true
  - type: input
    id: panel
    attributes:
      label: Panel
      description: The size you'd play it on
      placeholder: "16×16"
  - type: textarea
    id: references
    attributes:
      label: References
      description: |
        Links or sketches that help. Glyph only ships original or public-domain content, so no trademarked or copyrighted characters (game, film or brand mascots). If you're suggesting a public-domain work, say why it's public domain (title, year, creator).
