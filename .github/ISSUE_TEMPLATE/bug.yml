name: Bug report
description: Something in Glyph doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The quickest way to report a bug is **Device → Send feedback** in the app: it fills in the details below for you.
  - type: input
    id: app_version
    attributes:
      label: Glyph version
      description: "e.g. 1.3.0 (Android: Settings → Apps → Glyph)"
      placeholder: "1.3.0"
  - type: input
    id: phone
    attributes:
      label: Phone
      description: Model and Android version
      placeholder: "Pixel 8, Android 16"
  - type: input
    id: wled_version
    attributes:
      label: WLED version
      description: "Shown on the Info page of WLED's web interface"
      placeholder: "16.0.1"
  - type: input
    id: panel
    attributes:
      label: Panel
      description: Size and type of your display
      placeholder: "16×16"
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Display
        2. Swipe to …
        3. Tap Send
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Filled in automatically when you use Send feedback in the app
      render: text
