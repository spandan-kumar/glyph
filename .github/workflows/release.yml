name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Read versions
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pub=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//')
          name="${pub%%+*}"
          code="${pub##*+}"
          if [ "$name" != "$tag" ]; then
            echo "::warning::Tag v$tag does not match pubspec version $name"
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Signing secrets are not set; this release is debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Rename and checksum
        id: apk
        run: |
          mkdir -p dist
          apk="glyph-${{ steps.version.outputs.version }}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/$apk"
          (cd dist && sha256sum "$apk" > "$apk.sha256")
          cat "dist/$apk.sha256"
          echo "apk=dist/$apk" >> "$GITHUB_OUTPUT"

      - name: Release notes
        id: notes
        run: |
          notes="fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt"
          if [ -f "$notes" ]; then
            cp "$notes" dist/body.md
          else
            echo "::warning::No changelog at $notes"
            : > dist/body.md
          fi

      - uses: softprops/action-gh-release@v3
        id: release
        with:
          name: Glyph ${{ steps.version.outputs.version }}
          body_path: dist/body.md
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.apk }}.sha256

      # Here rather than in announce.yml: a release created with the
      # workflow's own token doesn't trigger other workflows.
      - name: Announce on Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NAME: Glyph ${{ steps.version.outputs.version }}
          URL: ${{ steps.release.outputs.url }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping."
            exit 0
          fi
          body="$(cat dist/body.md 2>/dev/null | head -c 1500)"
          jq -n --arg name "$NAME" --arg url "$URL" --arg body "$body" \
            '{username: "Glyph", content: ("**\($name)** is out\n\($url)\n\n\($body)")[0:2000]}' \
            | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
