name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Read versions
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pub=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//')
          name="${pub%%+*}"
          code="${pub##*+}"
          if [ "$name" != "$tag" ]; then
            echo "::error::Tag v$tag does not match pubspec version $name"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Check release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          SIGNING_LINEAGE_BASE64: ${{ secrets.ANDROID_SIGNING_LINEAGE_BASE64 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD \
            RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD SIGNING_LINEAGE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name. Both keys and the lineage are required."
              exit 1
            fi
          done

      - run: flutter pub get

      - name: Build unsigned APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --android-project-arg unsignedRelease=true

      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          SIGNING_LINEAGE_BASE64: ${{ secrets.ANDROID_SIGNING_LINEAGE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/glyph-signing.XXXXXX")
          trap 'rm -rf "$signing_dir"' EXIT
          apksigner=$(find "${ANDROID_HOME:?}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -executable | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo "::error::No Android build-tools apksigner found."
            exit 1
          fi
          echo "Using $apksigner"
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          old_sha256=8f7a1d1830d401866985253d480eb7f4748c4c1144a8eb77f0e11448c28f9b68
          new_sha256=d9f51a1f873db96bfec0be9c230e5ec2ead72660aa42abaf04389291ad84441e
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_dir/old.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/new.jks"
          printf '%s' "$SIGNING_LINEAGE_BASE64" | base64 --decode > "$signing_dir/signing.lineage"
          key_sha256=$(keytool -exportcert -keystore "$signing_dir/new.jks" \
            -alias "$RELEASE_KEY_ALIAS" -storepass:env RELEASE_KEYSTORE_PASSWORD | sha256sum | awk '{print $1}')
          if [ "$key_sha256" != "$new_sha256" ]; then
            echo "::error::The release key does not match Glyph's expected signing certificate."
            exit 1
          fi
          sign_args=(--ks "$signing_dir/old.jks" --ks-key-alias "$KEY_ALIAS"
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD
            --v1-signing-enabled true --v2-signing-enabled true
            --v3-signing-enabled true --v4-signing-enabled false
            --next-signer --ks "$signing_dir/new.jks" --ks-key-alias "$RELEASE_KEY_ALIAS"
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD
            --lineage "$signing_dir/signing.lineage" --rotation-min-sdk-version 28)
          "$apksigner" sign "${sign_args[@]}" "$apk"

          require_cert() {
            if ! awk '/Signer.* certificate SHA-256 digest:/ {print tolower($NF)}' "$1" | grep -Fxq "$2"; then
              echo "::error::Expected signing certificate $2 is missing from $1."
              exit 1
            fi
          }
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$signing_dir/verify.txt"
          # A full-range v3 verification prints the newest signer, not v2's old signer.
          "$apksigner" verify --verbose --print-certs --min-sdk-version 24 --max-sdk-version 27 "$apk" \
            | tee "$signing_dir/verify-old.txt"
          require_cert "$signing_dir/verify-old.txt" "$old_sha256"
          require_cert "$signing_dir/verify.txt" "$new_sha256"
          grep -Fxq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$signing_dir/verify.txt"
          "$apksigner" verify --verbose --print-certs --min-sdk-version 28 --max-sdk-version 32 "$apk" \
            | tee "$signing_dir/verify-rotated.txt"
          require_cert "$signing_dir/verify-rotated.txt" "$new_sha256"
          # Read the lineage from the signed APK, not just the supplied lineage file.
          "$apksigner" lineage --in "$apk" --print-certs | tee "$signing_dir/lineage.txt"
          require_cert "$signing_dir/lineage.txt" "$old_sha256"
          require_cert "$signing_dir/lineage.txt" "$new_sha256"

      - name: Rename and checksum
        id: apk
        run: |
          mkdir -p dist
          apk="glyph-${{ steps.version.outputs.version }}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/$apk"
          (cd dist && sha256sum "$apk" > "$apk.sha256")
          cat "dist/$apk.sha256"
          echo "apk=dist/$apk" >> "$GITHUB_OUTPUT"

      # The changelog says what's new; the block after it says what Glyph is
      # and how to install it, for people arriving from a post or a link.
      - name: Release notes
        id: notes
        env:
          APK: glyph-${{ steps.version.outputs.version }}-arm64-v8a.apk
        run: |
          notes="fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt"
          if [ -f "$notes" ]; then
            cp "$notes" dist/changes.md
          else
            echo "::warning::No changelog at $notes"
            : > dist/changes.md
          fi
          {
            echo "## What's new"
            echo
            cat dist/changes.md
            echo
            cat <<EOF
          ## What is Glyph?

          A free, open-source Android app for WLED LED matrices. It sets up your
          matrix in three taps, then fills it with 13,000+ animations, a pixel
          editor, clocks, music and games. No account, no ads, no tracking.

          **You need:** an Android phone (7.0+, 64-bit ARM) and a WLED matrix on
          the same Wi-Fi. No device yet? You can still browse, draw and play.

          ## Install

          1. On your phone, download **\`$APK\`** below (the only installer).
          2. Open it from your notifications or Downloads.
          3. If Android asks, allow installs from this source (your browser or
             file manager), go back and tap **Install**.

          The \`.sha256\` file and the "Source code" archives aren't installers;
          the \`.sha256\` lets you check the download.

          **Updates:** add Glyph to
          [Obtainium](https://apps.obtainium.imranr.dev/redirect?r=obtainium://add/https://github.com/spandan-kumar/glyph)
          to get each new release automatically.

          Help and setups: [Discord](https://discord.gg/fMbzGQd6wk) ·
          [Discussions](https://github.com/spandan-kumar/glyph/discussions) ·
          [Report a problem](https://github.com/spandan-kumar/glyph/issues/new/choose)
          EOF
          } > dist/body.md

      - uses: softprops/action-gh-release@v3
        id: release
        with:
          name: Glyph ${{ steps.version.outputs.version }}
          body_path: dist/body.md
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.apk }}.sha256

      # Here rather than in announce.yml: a release created with the
      # workflow's own token doesn't trigger other workflows.
      - name: Announce on Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NAME: Glyph ${{ steps.version.outputs.version }}
          URL: ${{ steps.release.outputs.url }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping."
            exit 0
          fi
          body="$(cat dist/changes.md 2>/dev/null | head -c 1500)"
          jq -n --arg name "$NAME" --arg url "$URL" --arg body "$body" \
            '{username: "Glyph", content: ("**\($name)** is out\n\($url)\n\n\($body)")[0:2000]}' \
            | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
