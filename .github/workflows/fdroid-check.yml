# Builds the F-Droid recipe (docs/launch/fdroid/) in F-Droid's own buildserver
# image, the way fdroiddata's merge-request pipeline does, so problems show up
# before submission. Manual only; it builds whatever commit you choose.
name: F-Droid check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: glyph
          persist-credentials: false
      - name: Build like F-Droid
        run: |
          sha=$(git -C glyph rev-parse HEAD)
          docker run --rm --privileged \
            -v "$PWD/glyph:/glyph:ro" -v "$PWD/out:/out" \
            registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie \
            bash /glyph/tool/fdroid_check.sh /glyph "$sha"
      - name: Keep the build log and APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fdroid-check
          path: out/
          if-no-files-found: ignore
